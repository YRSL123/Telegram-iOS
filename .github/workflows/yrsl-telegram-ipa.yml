name: YRSL Telegram unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yrsl-telegram-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Upstream pins Xcode 27.1. The old macos-13 runner in the upstream
    # workflow cannot run it. GitHub's xcode-27 ARM64 image includes 27.1.
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}

    steps:
      - name: Checkout Telegram and its submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Prepare Xcode and per-app API configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$TELEGRAM_API_ID" ] || [ -z "$TELEGRAM_API_HASH" ]; then
            echo 'Set TELEGRAM_API_ID and TELEGRAM_API_HASH as repository Actions secrets.'
            exit 1
          fi
          XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('build-system/appstore-configuration.json')
          cfg = json.loads(p.read_text())
          cfg['bundle_id'] = 'com.yrsl.telegram.demo'
          cfg['api_id'] = os.environ['TELEGRAM_API_ID']
          cfg['api_hash'] = os.environ['TELEGRAM_API_HASH']
          cfg['app_specific_url_scheme'] = 'yrsltelegram'
          cfg['is_internal_build'] = 'true'
          cfg['is_appstore_build'] = 'false'
          cfg['enable_icloud'] = False
          cfg['enable_siri'] = False
          p.write_text(json.dumps(cfg, indent=2) + '\n')
          PY

      - name: Build unsigned iPhone IPA
        shell: bash
        run: |
          set -euo pipefail
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            build \
            --configurationPath=build-system/appstore-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="${GITHUB_RUN_NUMBER}"
          mkdir -p build/yrsl-artifacts
          test -f bazel-bin/Telegram/Telegram.ipa
          cp bazel-bin/Telegram/Telegram.ipa build/yrsl-artifacts/YRSLTelegram-unsigned.ipa

      - name: Upload IPA for AltStore signing
        uses: actions/upload-artifact@v4
        with:
          name: YRSLTelegram-unsigned-IPA
          path: build/yrsl-artifacts/YRSLTelegram-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
